name: Validate catalogs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: validator
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Validate catalogs and new-language completeness
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            python3 validator/tools/catalog.py validate --repo candidate --base-ref "$PR_BASE" --head-ref "$PR_HEAD"
          else
            python3 validator/tools/catalog.py validate --repo candidate
          fi
